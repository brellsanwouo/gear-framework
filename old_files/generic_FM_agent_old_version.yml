# Generic Agent Feature Model in YAML
# Converted from UVL format with type preservation

namespace: GenericAgent

features:
  GenericAgent:
    type: object
    children:
      # ========================================================================
      # MANDATORY FEATURES
      # ========================================================================
      AgentIdentity:
        type: object
        children:
          Name:
            type: str
          Purpose:
            type: str
          ContextDescription:
            type: str

      AgentType:
        type: object
        children:
          SingleAgent:
            type: bool
          MultiAgent:
            type: object
            children:
              SequentialAgent:
                type: bool
              ParallelAgent:
                type: bool
              LoopAgent:
                type: bool
              CustomAgent:
                type: bool

      LLMConfiguration:
        type: object
        children:
          Model:
            type: str
          ModelParameters:
            type: object
            children:
              Temperature:
                type: float
              MaxTokens:
                type: int
              TopP:
                type: float
              StopSequences:
                type: list
              AdditionalParams:
                type: object
                children:
                  TopK:
                    type: int
                  FrequencyPenalty:
                    type: float
                  PresencePenalty:
                    type: float
                  Seed:
                    type: int
          APIConfiguration:
            type: object
            children:
              APIKey:
                type: str
              Timeout:
                type: int
              MaxRetries:
                type: int
          SafetyConfiguration:
            type: dict

      InstructionDefinition:
        type: object
        children:
          TaskSpecification:
            type: object
            children:
              TaskName:
                type: str
              TaskDescription:
                type: str
              ExpectedOutput:
                type: str
              AssignedAgent:
                type: str

      # ========================================================================
      # OPTIONAL FEATURES
      # ========================================================================
      Tools:
        type: object
        children:
          ToolScope:
            type: object
            children:
              AgentLevelTools:
                type: bool
              TaskLevelTools:
                type: bool
          ToolTypes:
            type: object
            children:
              FunctionBasedTools:
                type: bool
              ThirdPartyIntegrations:
                type: bool
              MCPTools:
                type: bool
              BuiltInTools:
                type: bool
              AgentAsToolReference:
                type: bool

      ExecutionControl:
        type: object
        children:
          DelegationControl:
            type: bool
          CodeExecutionControl:
            type: bool
          AsyncExecutionControl:
            type: bool
          HumanInteractionControl:
            type: bool
          VerbosityControl:
            type: bool
          CachingControl:
            type: bool

      MemorySystem:
        type: bool

      PlanningCapability:
        type: object
        children:
          PlanningStrategy:
            type: object
            children:
              BuiltInPlanner:
                type: bool
              ReActPlanner:
                type: bool
              CustomPlanner:
                type: bool
          ThinkingConfiguration:
            type: object
            children:
              IncludeThoughts:
                type: bool
              ThinkingBudget:
                type: int

      DataFlow:
        type: object
        children:
          InputDefinition:
            type: object
            children:
              InputSchema:
                type: dict
              ContextSources:
                type: list
          OutputDefinition:
            type: object
            children:
              OutputSchema:
                type: dict
              OutputFormat:
                type: object
                children:
                  FileOutput:
                    type: object
                    children:
                      CreateDirectory:
                        type: bool
                  JSONOutput:
                    type: bool
                  StructuredOutput:
                    type: bool
                  MarkdownOutput:
                    type: bool
              OutputCallbacks:
                type: list

      GuardrailsAndValidation:
        type: object
        children:
          ValidationRules:
            type: object
            children:
              GuardrailMaxRetries:
                type: int
              ValidationStrategy:
                type: object
                children:
                  FunctionBasedValidation:
                    type: bool
                  LLMBasedValidation:
                    type: bool
          LifecycleHooks:
            type: object
            children:
              BeforeAgentExecution:
                type: bool
              AfterAgentExecution:
                type: bool
              BeforeModelCall:
                type: bool
              AfterModelCall:
                type: bool
              BeforeToolCall:
                type: bool
              AfterToolCall:
                type: bool

      AgentComposition:
        type: object
        children:
          SubAgents:
            type: list
          ExecutionConstraints:
            type: dict
          KnowledgeIntegration:
            type: object
            children:
              IntegrationLevel:
                type: object
                children:
                  AgentLevel:
                    type: bool
                  SystemLevel:
                    type: bool
              SupportedFormats:
                type: object
                children:
                  TextBased:
                    type: bool
                  StructuredData:
                    type: bool
              StorageConfiguration:
                type: dict

constraints:
  type: object
  - expression: "MultiAgent => SubAgents"
    description: "Multi-agent configuration requires sub-agents to be defined"
  - expression: "FileOutput => OutputSchema"
    description: "File output requires an output schema to be defined"
