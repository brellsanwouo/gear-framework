$schema: "https://json-schema.org/draft/2020-12/schema"
title: "AgentDefinition"
type: object
properties:
  BaseAgent:
    type: object
    properties:
      AgentType:
        type: string
        enum: [LlmAgent, SequentialAgent, ParallelAgent, LoopAgent, CustomAgent, RemoteA2AAgent]
      AgentCardReference:
        type: object
        properties:
          AgentCardURL:
            type: string
            format: uri
          AgentCardJSON:
            type: object
        additionalProperties: false
      Name: { type: string }
      Description: { type: string }
      SubAgents:
        type: array
        items: { type: object }
      Constraints:
        type: array
        items: { type: string }
    required: [AgentType, Name]
    additionalProperties: false
  LLMAgentConfig:
    type: object
    properties:
      Model: { type: string }
      GenerateContentConfig:
        type: object
        properties:
          Temperature: { type: number }
          MaxOutputTokens: { type: integer }
          TopP: { type: number }
          TopK: { type: integer }
          SafetySettings: { type: object }
        additionalProperties: false
    required: [Model]
    additionalProperties: false
  Configurations:
    type: object
    properties:
      Instruction: { type: string }
      Tools:
        type: array
        items: { type: string }
      DataStructure:
        type: object
        properties:
          OutputKey: { type: string }
          InputSchema: { type: object }
          OutputSchema: { type: object }
        additionalProperties: false
      IncludeContents:
        type: string
        enum: [Default, None]
      Planner:
        type: object
        properties:
          BuiltInPlanner:
            type: object
            properties:
              ThinkingConfig:
                type: object
                properties:
                  IncludeThoughts: { type: boolean }
                  ThinkingBudget: { type: integer }
                additionalProperties: false
            additionalProperties: false
          PlanReactPlanner: { type: boolean }
        additionalProperties: false
      CodeExecutor: { type: boolean }
    required: [Instruction]
    additionalProperties: false
  Guardrails:
    type: object
    properties:
      AgentLifecycle:
        type: object
        properties:
          BeforeAgentCallback: { type: string }
          AfterAgentCallback: { type: string }
        additionalProperties: false
      ModelInteraction:
        type: object
        properties:
          BeforeModelCallback: { type: string }
          AfterModelCallback: { type: string }
        additionalProperties: false
      ToolExecution:
        type: object
        properties:
          BeforeToolCallback: { type: string }
          AfterToolCallback: { type: string }
        additionalProperties: false
    additionalProperties: false
required: [BaseAgent]
additionalProperties: false
