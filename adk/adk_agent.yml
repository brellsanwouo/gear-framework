agent_characteristics:
  core_agent_types:
    llm_agent:
      identity:
        name:
          required: true
        description: {}
        model:
          required: true
      instruction:
        required: true
        type: string_or_function
      instruction_elements:
        collection: [core_task, persona, behavior_constraints, tool_usage_guidance, output_format, template_variables]
      tools:
        collection: [FunctionTool, BaseTool, AgentTool]
      advanced_configuration:
        generate_content_config:
          options: [temperature, max_output_tokens, top_p, top_k, safety_settings]
        input_schema: {}
        output_schema: {}
        output_key: {}
        include_contents:
          alternatives: [default, none]
        planner:
          built_in_planner:
            thinking_config:
              options: [include_thoughts, thinking_budget]
          plan_react_planner: {}
        code_executor: {}
    workflow_agents:
      alternatives: [sequential_agent, parallel_agent, loop_agent]
    custom_agents:
      use_cases:
        collection: [conditional_logic, complex_state_management, external_integrations, dynamic_agent_selection, unique_workflow_patterns]
      core_implementation:
        collection: [execution_method, event_stream, invocation_context]
      sub_agents_and_state:
        collection: [sub_agents_list, state_exchange]

  agent_config:
    entry_points:
      collection: [adk_create_config, root_agent.yaml, .env]
    run_modes:
      options: [adk web, adk run, adk api_server]
    example_configs:
      collection: [built_in_tool, custom_tool, sub_agents]
    known_limitations:
      model_support:
        collection: [gemini_only]
      language_support:
        collection: [python_only_for_tool_code]
      tool_support:
        supported_tools:
          collection: [google_search, load_artifacts, url_context, exit_loop, preload_memory, get_user_choice, enterprise_web_search, load_web_page]
        not_supported:
          collection: [AgentTool, LongRunningFunctionTool, VertexAiSearchTool, McpToolset, ExampleTool]
      agent_type_support:
        not_supported:
          collection: [LangGraphAgent, A2aAgent]

  models:
    google_gemini:
      apis:
        collection: [Gemini Interactions API]
      authentication:
        alternatives: [Google AI Studio, Vertex AI user credentials, Vertex AI express mode, Vertex AI service account]
    anthropic:
      collection: [supported]
    apigee_gateway:
      collection: [supported]
    litellm:
      options: [cloud_and_proprietary, open_and_local]
      ollama_providers:
        alternatives: [ollama_chat, openai]
      self_hosted_endpoint:
        alternatives: [vLLM]
    vertex_ai_hosted_and_tuned:
      model_garden_deployments: true
      fine_tuned_model_endpoints: true
      third_party_on_vertex_ai: true

  tools:
    built_in_tools:
      gemini_api_tools:
        collection: [Google Search, Code Execution, Computer Use]
      google_cloud_tools:
        collection: [Apigee API Hub, API Registry, Application Integration, BigQuery Agent Analytics, BigQuery Tools, Bigtable Tools, GKE Code Executor, Spanner Tools, MCP Toolbox for Databases, Vertex AI RAG Engine, Vertex AI Search]
      third_party_tools:
        collection: [Atlassian, GitHub, GitLab, Hugging Face, Linear, n8n, Notion, Paypal, Qdrant, AG UI]
    tool_limitations:
      one_tool_per_agent: true
      workarounds:
        collection: [AgentTool.create, bypass_multi_tools_limit]
    custom_tools:
      tool_definition:
        collection: [tool_function_or_class, schema, description, input_signature]
      tool_context:
        collection: [context_data_access, state_management, event_flow_control]
      tool_types:
        alternatives: [FunctionTool, OpenAPI_tool, MCP_tool]
      toolsets:
        collection: [BaseToolset]
      function_tools:
        collection: [function_signatures, tool_data_passing, long_running_function_tools, intermediate_updates, final_updates]
      agent_as_tool:
        collection: [AgentTool]
      performance:
        collection: [parallel_execution, yielding_for_long_loops, thread_pools, process_chunking, parallel_ready_prompts]
      confirmation:
        alternatives: [boolean_confirmation, require_confirmation_function, advanced_confirmation, remote_confirmation_rest]
      mcp_tools:
        collection: [MCP_servers, McpToolset, MCP_server_build, deployment_patterns, connection_management]
      openapi_tools:
        collection: [openapi_key_components, openapi_usage_workflow]
      authentication:
        collection: [supported_credential_types, tool_auth_configuration, oauth_oidc_flow, custom_tool_auth]

  context_and_invocation:
    context_types:
      alternatives: [invocation_context, readonly_context, callback_context, tool_context]
    access_information:
      collection: [session.state, agent_name, invocation_id, user_content]
    state_management:
      update_methods:
        options: [callback_context.state, tool_context.state]
      tracked_updates:
        collection: [EventActions]
    artifacts_access:
      options: [save_artifact, load_artifact, list_artifacts]
    memory_access:
      options: [PreloadMemory, LoadMemory]
    context_caching:
      options: [min_tokens, ttl_seconds, cache_intervals]
    context_compaction:
      options: [compaction_interval, overlap_size, summarizer]

  sessions_and_memory:
    session_object:
      identifiers:
        collection: [id, app_name, user_id]
      history:
        collection: [events]
      state:
        collection: [session.state]
    session_service:
      responsibilities:
        collection: [create_session, get_session, append_event, list_sessions, delete_session]
      implementations:
        alternatives: [InMemorySessionService, DatabaseSessionService, VertexAiSessionService]
    state_characteristics:
      collection: [string_keys, serializable_values, mutable]
    state_scopes:
      alternatives: [session, user, app, temp]
    rewind:
      collection: [capability]
    memory_service:
      roles:
        collection: [add_session_to_memory, search_memory]
      implementations:
        alternatives: [InMemory, VertexAiMemoryBankService]
      access_tools:
        options: [PreloadMemory, LoadMemory]
    express_mode:
      collection: [vertex_ai_sessions_and_memory]

  callbacks:
    agent_lifecycle:
      collection: [before_agent_callback, after_agent_callback]
    model_interaction:
      collection: [before_model_callback, after_model_callback]
    tool_execution:
      collection: [before_tool_callback, after_tool_callback]
    design_patterns:
      collection: [guardrails, policy_enforcement, state_management, logging, monitoring, caching, request_modification, conditional_skipping, tool_specific_actions, artifact_handling]

  artifacts:
    artifact_service:
      collection: [BaseArtifactService]
    artifact_data:
      collection: [filename, versioning, namespacing]
    access_methods:
      options: [save, load, list]
    implementations:
      alternatives: [InMemoryArtifactService, GcsArtifactService]

  events:
    characteristics:
      collection: [origin, type, actions, side_effects, final_response_detection, event_flow]

  runtime:
    event_loop: true
    execution_logic_components:
      collection: [agent, tool, callback]
    core_entities:
      collection: [event, services, session, invocation]
    behaviors:
      collection: [state_updates, dirty_reads, streaming_mode, async_run_async]
    run_config:
      parameters:
        options: [speech_config, response_modalities, save_input_blobs_as_artifacts, support_cfc, streaming_mode, output_audio_transcription, max_llm_calls]
    api_server:
      endpoints:
        collection: [session_management, agent_execution]
    resume:
      collection: [resumable_workflows]

  streaming:
    bidi_streaming: true
    configuration: true
    streaming_tools: true

  apps_and_plugins:
    app_class:
      collection: [root_agent]
    plugins:
      prebuilt_plugins: true
      plugin_registration: true
      callback_hooks:
        collection: [user_message, runner_start, agent_execution, model, tool, event, runner_end]
      reflect_and_retry_plugin:
        options: [configuration_settings, advanced_configuration]

  safety_and_security:
    risks: true
    best_practices: true
    identity_and_authorization: true
    guardrails: true
    sandboxed_code_execution: true
    evaluations: true
    network_controls:
      collection: [vpc_sc_perimeters]

  evaluation:
    why_evaluate: true
    what_to_evaluate:
      collection: [trajectory, tool_use, final_response_quality]
    evaluation_criteria:
      collection: [tool_trajectory_avg_score, response_match_score, final_response_match_v2, rubric_based_final_response_quality_v1, rubric_based_tool_use_quality_v1]
    user_simulation: true
    run_methods:
      alternatives: [adk web, pytest, adk eval]

  observability:
    logging:
      options: [logging_configuration, log_levels, debugging]
    cloud_trace: true
    bigquery_agent_analytics_plugin: true
