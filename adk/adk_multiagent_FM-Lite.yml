$schema: "https://json-schema.org/draft/2020-12/schema"
title: "ADKMultiAgentSystem"
type: object
properties:
  SystemDefinition:
    type: object
    properties:
      RootAgent: { type: object }
      Agents:
        type: array
        items: { type: object }
      OrchestrationMechanisms:
        type: object
        properties:
          WorkflowAgents:
            type: object
            properties:
              SequentialAgent: { type: boolean }
              ParallelAgent: { type: boolean }
              LoopAgent: { type: boolean }
            additionalProperties: false
          Agent2Agent: { type: boolean }
          CustomAgent: { type: boolean }
        additionalProperties: false
    required: [RootAgent, Agents]
    additionalProperties: false
  Infrastructure:
    type: object
    properties:
      Runner:
        type: object
        properties:
          Configuration:
            type: object
            properties:
              RequiredParameters:
                type: object
                properties:
                  Agent: { type: boolean }
                  SessionService: { type: boolean }
                additionalProperties: false
              OptionalParameters:
                type: object
                properties:
                  MemoryService: { type: boolean }
                  ArtifactService: { type: boolean }
                additionalProperties: false
            additionalProperties: false
        additionalProperties: false
      SessionServiceConfig:
        type: object
        properties:
          Session_Implementations:
            type: object
            properties:
              InMemorySessionService: { type: boolean }
              DatabaseSessionService: { type: boolean }
              VertexAiSessionService: { type: boolean }
            additionalProperties: false
          Sessions_Operations:
            type: object
            properties:
              CreateSession: { type: boolean }
              GetSession: { type: boolean }
              AppendEvent: { type: boolean }
              ListSessions: { type: boolean }
              DeleteSession: { type: boolean }
            additionalProperties: false
        additionalProperties: false
      MemoryServiceConfig:
        type: object
        properties:
          Memory_Implementations:
            type: object
            properties:
              InMemoryMemoryService: { type: boolean }
              VertexAiMemoryBankService: { type: boolean }
            additionalProperties: false
          Memory_Operations:
            type: object
            properties:
              AddSessionToMemory: { type: boolean }
              SearchMemory: { type: boolean }
            additionalProperties: false
          MemoryIntegrationTools:
            type: object
            properties:
              PreloadMemory: { type: boolean }
              LoadMemory: { type: boolean }
            additionalProperties: false
        additionalProperties: false
      ArtifactServiceConfig:
        type: object
        properties:
          Artefact_Implementations:
            type: object
            properties:
              InMemoryArtifactService: { type: boolean }
              GcsArtifactService: { type: boolean }
            additionalProperties: false
          Artefact_Operations:
            type: object
            properties:
              SaveArtifact: { type: boolean }
              LoadArtifact: { type: boolean }
              ListArtifacts: { type: boolean }
            additionalProperties: false
          Scoping:
            type: object
            properties:
              SessionScoped: { type: boolean }
              UserScoped: { type: boolean }
            additionalProperties: false
          Versioning:
            type: object
            properties:
              Automatic: { type: boolean }
            additionalProperties: false
        additionalProperties: false
    additionalProperties: false
  EventsConfig:
    type: object
    properties:
      Storage:
        type: object
        properties:
          SessionEvents: { type: boolean }
        required: [SessionEvents]
        additionalProperties: false
      EventTypes:
        type: object
        properties:
          UserMessage: { type: boolean }
          AgentResponse: { type: boolean }
          ToolCall: { type: boolean }
          ToolResult: { type: boolean }
          StateChange: { type: boolean }
          AgentTransfer: { type: boolean }
        additionalProperties: false
      EventActions:
        type: object
        properties:
          StateDelta: { type: boolean }
          Escalate: { type: boolean }
        additionalProperties: false
    additionalProperties: false
required: [SystemDefinition, Infrastructure, EventsConfig]
additionalProperties: false
