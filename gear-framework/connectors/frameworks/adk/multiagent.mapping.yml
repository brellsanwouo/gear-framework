# Gear -> ADK (workflow)
# Source model: gear-framework/gear/gear-multiagent.uvl (YAML runtime: WorkflowName, Items, Edges, Memory)

- from: WorkflowName
  to: SystemDefinition.RootAgent
  kind: partial
  notes: "Nom du root workflow ADK."

- from: WorkflowName
  to: Runtime.Workflow.RootName
  kind: partial
  notes: "Nom applique au root_agent dans le code Python."

- from: Items.Agents
  to: SystemDefinition.Agents
  kind: direct

- from: Items.Modules
  to: SystemDefinition.WorkflowModules
  kind: partial

- from: Edges
  to: SystemDefinition.WorkflowEdges
  kind: partial

- from: Memory
  to: Runtime.Memory.WorkflowEnabled
  kind: partial
  notes: "Active la memoire long terme au niveau workflow."

- from:
  to: Runtime.Memory.MemoryServiceClass
  value: InMemoryMemoryService
  kind: partial
  notes: "Classe memory service utilisee quand la memoire est activee."

- from:
  to: Runtime.Memory.AgentToolClass
  value: PreloadMemoryTool
  kind: partial
  notes: "Outil memory ajoute aux agents quand memoire activee."

- from:
  to: Infrastructure.Runner.Configuration.AppName
  value: gear-framework
  kind: partial

