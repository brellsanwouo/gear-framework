# Gear -> CrewAI (workflow)
# Source model: gear-framework/gear/gear-multiagent.uvl (YAML runtime: WorkflowName, Items, Edges, Memory)

- from: WorkflowName
  to: Crew.Metadata.Name
  kind: partial
  notes: "Nom logique du workflow."

- from: Items.Agents
  to: Crew.EssentialComponents.Agents
  kind: direct
  notes: "Liste des agents utilises dans le workflow."

- from: Items.Modules
  to: Crew.EssentialComponents.Modules
  kind: partial
  notes: "Information de modules (utile pour extensions)."

- from: Edges
  to: Crew.Orchestration.Edges
  kind: partial
  notes: "Graphe d'ordre du workflow."

- from: Memory
  to: Crew.MemoryAndPerformance.Memory
  kind: partial

- from:
  to: Crew.EssentialComponents.Process
  value: sequential
  kind: partial
  notes: "Par defaut, CrewAI utilise Process.sequential."
