$schema: "https://json-schema.org/draft/2020-12/schema"
title: "GearAgent"
type: object
properties:
  AgentIdentity:
    type: object
    properties:
      Name: { type: string }
      Purpose: { type: string }
      ContextDescription: { type: string }
    required: [Name, Purpose, ContextDescription]
    additionalProperties: false
  LLMConfiguration:
    type: object
    properties:
      Provider: { type: string }
      Model: { type: string }
      APIKey: { type: string }
      BaseURL: { type: string }
      Timeout: { type: integer }
      MaxRetries: { type: integer }
      ModelParameters:
        type: object
        properties:
          Temperature: { type: number }
          MaxTokens: { type: integer }
          TopP: { type: number }
          StopSequences:
            type: array
            items: { type: string }
          AdditionalParams: { type: object }
          TopK: { type: integer }
          FrequencyPenalty: { type: number }
          PresencePenalty: { type: number }
          Seed: { type: integer }
        additionalProperties: false
    required: [Provider, Model]
    additionalProperties: false
  TaskSpecification:
    type: object
    properties:
      TaskName: { type: string }
      TaskDescription: { type: string }
      ExpectedOutput: { type: string }
    required: [TaskName, TaskDescription, ExpectedOutput]
    additionalProperties: false
  Tools:
    type: array
    items: { type: string }
  ExecutionControl:
    type: object
    properties:
      DelegationControl: { type: boolean }
      CodeExecutionControl: { type: boolean }
      AsyncExecutionControl: { type: boolean }
      HumanInteractionControl: { type: boolean }
      VerbosityControl: { type: boolean }
      CachingControl: { type: boolean }
    additionalProperties: false
  Memory: { type: boolean }
  Reasoning: { type: boolean }
required: [AgentIdentity, LLMConfiguration, TaskSpecification]
additionalProperties: false
