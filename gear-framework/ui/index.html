<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gear Framework UI</title>
    <link rel="stylesheet" href="ui/styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
    <script src="../SDK/gear_sdk/assembly-engine.js" defer></script>
    <script src="ui/app.js" defer></script>
    <link rel="stylesheet" href="overlay.css">
    <script src="ui/overlay.js" defer></script>
  </head>
  <body>
    <header class="page-header">
      <div>
        <h1>Gear Framework</h1>
        <p class="hint">UI Gear + connecteurs extensibles.</p>
      </div>
    </header>

    <main class="layout layout--split">
      <div class="left-column">
        <section class="panel section-panel">
        <div class="panel-header">
          <h2>Gear Agents</h2>
          <!-- <p class="hint">Charge un UVL d’agent puis crée autant d’agents que nécessaire.</p> -->
        </div>
        <!--
        <div class="import-grid">
          <div class="import-block">
            <h3>Importer un UVL d’agent</h3>
            <div class="loader-controls">
              <button id="loadDefault" type="button" class="secondary">Charger gear-agent.uvl</button>
              <label class="file-input">
                <span class="file-label">Charger un UVL d’agent</span>
                <span class="file-name" data-file-name>Choisir un fichier</span>
                <input id="uvlFileInput" type="file" accept=".uvl,.txt" />
              </label>
            </div>
          </div>
        </div>
        <div id="agentStatus" class="status" role="status" aria-live="polite"></div>
        -->

        <div class="agent-actions">
          <div>
            <!-- <h3>Instances d’agents</h3>
            <p class="hint">Chaque agent a son propre formulaire et son propre YAML.</p> -->
          </div>
          <button id="addAgent" type="button">Ajouter un agent</button>
        </div>

        <div id="agentsContainer" class="agents-container" aria-live="polite"></div>
        </section>

        <section class="panel section-panel">
        <div class="panel-header">
          <h2>Gear Modules</h2>
          <!-- <p class="hint">Charge un UVL de module puis crée des modules réutilisables.</p> -->
        </div>
        <!--
        <div class="import-grid">
          <div class="import-block">
            <h3>Importer un UVL de module</h3>
            <div class="loader-controls">
              <button id="loadModuleDefault" type="button" class="secondary">Charger gear-module.uvl</button>
              <label class="file-input">
                <span class="file-label">Charger un UVL de module</span>
                <span class="file-name" data-file-name>Choisir un fichier</span>
                <input id="moduleUvlFileInput" type="file" accept=".uvl,.txt" />
              </label>
            </div>
          </div>
        </div>
        <div id="moduleStatus" class="status" role="status" aria-live="polite"></div>
        -->

        <div class="agent-actions">
          <div>
            <!-- <h3>Instances de modules</h3> -->
          </div>
          <button id="addModule" type="button">Ajouter un module</button>
        </div>

        <div id="modulesContainer" class="agents-container" aria-live="polite"></div>
        </section>

        <section class="panel section-panel">
        <div class="panel-header">
          <h2>Gear Workflow</h2>
          <!-- <p class="hint">Définis la structure multi-agent (nœuds, stratégies, liens).</p> -->
        </div>
        <!--
        <div class="import-grid">
          <div class="import-block">
            <h3>Importer un UVL d’orchestration</h3>
            <div class="loader-controls">
              <button id="loadOrchestrationDefault" type="button" class="secondary">Charger gear-multiagent.uvl</button>
              <label class="file-input">
                <span class="file-label">Charger un UVL d’orchestration</span>
                <span class="file-name" data-file-name>Choisir un fichier</span>
                <input id="orchestrationUvlFileInput" type="file" accept=".uvl,.txt" />
              </label>
            </div>
          </div>
        </div>
        <div id="orchestrationStatus" class="status" role="status" aria-live="polite"></div>
        -->

        <div class="agent-actions">
          <div>
            <!-- <h3>Instances d’orchestration</h3>
            <p class="hint">Chaque orchestration a son propre formulaire et son propre YAML.</p> -->
          </div>
          <!-- <button id="addOrchestration" type="button">Ajouter un workflow</button> -->
        </div>
        <div id="orchestrationContainer" class="agents-container" aria-live="polite"></div>
        </section>

        <section class="panel section-panel">
          <div class="panel-header">
            <h2>Connecteurs</h2>
            <p class="hint">Frameworks branchables depuis <code>connectors/registry.yml</code>.</p>
          </div>
          <div id="connectorsStatus" class="status" role="status" aria-live="polite"></div>
          <ul id="connectorsList" class="connector-list"></ul>
        </section>
      </div>

      <aside class="panel output-panel">
        <div class="output-header">
          <h2>Traduction en YAML</h2>
          <p>Le rendu suit la table de conversion sélectionnée.</p>
          <div id="targetTabs" class="segmented tabs" role="tablist" aria-label="Cible de conversion"></div>
        </div>
        <div id="targetPanelsContainer"></div>
      </aside>
    </main>

    <template id="agentTemplate">
      <details class="agent-card" open>
        <summary>
          <div>
            Agent : <span class="agent-title">(nouvel agent)</span>
          </div>
          <div class="summary-actions">
            <span class="missing-badge" data-missing-badge hidden>Champ obligatoire manquant</span>
            <button type="button" class="secondary accent" data-duplicate-agent>Dupliquer</button>
            <button type="button" class="remove-agent secondary danger">Supprimer</button>
          </div>
        </summary>
        <div class="agent-tabs">
          <div class="segmented tabs" role="tablist" aria-label="Vue agent">
            <label class="segmented-item" role="tab" aria-selected="true">
              <input type="radio" name="agentTab" value="features" checked data-default-tab="features" />
              Features
            </label>
            <label class="segmented-item" role="tab" aria-selected="false">
              <input type="radio" name="agentTab" value="yaml" data-default-tab="yaml" />
              Résumé YAML
            </label>
          </div>
        </div>
        <div class="agent-body">
          <section class="agent-tab-panel" data-tab-panel="features">
            <div class="agent-column">
              <h3>Features</h3>
              <div class="tree" data-agent-tree aria-label="Arbre des features"></div>
            </div>
          </section>
          <section class="agent-tab-panel" data-tab-panel="yaml">
            <div class="agent-column agent-column--summary">
              <div class="summary-block">
                <h3>Résumé YAML</h3>
                <p class="hint">Coller un YAML ici met à jour instantanément l’agent.</p>
                <div class="yaml-editor">
                  <pre class="code-sample yaml-highlight" data-agent-yaml-preview># Aperçu YAML</pre>
                  <textarea class="yaml-output yaml-input" rows="18" data-agent-yaml placeholder="Le YAML résumé apparaîtra ici..." spellcheck="false"></textarea>
                </div>
                <div class="yaml-actions">
                  <button type="button" class="secondary" data-agent-copy-yaml>Copier</button>
                  <button type="button" class="secondary" data-agent-download-yaml>Télécharger</button>
                  <button type="button" data-agent-load-yaml>Charger le YAML</button>
                </div>
              </div>
            </div>
          </section>
        </div>
      </details>
      <!-- START ANALYSE FLAMAPY-->
      <section class="flamapy analysis">
         <div class="analysis-panel">
          <div class="analysis-controls">
            <button type="button" class="secondary" data-analyze-agent-btn>
              Analyser la configuration
            </button>
          </div>

          <div class="analysis-results" data-analysis-results-agent hidden>
            <div class="stat-row">
              <span class="stat-label">Validité :</span>
              <span class="stat-value" data-stat-valid-agent>-</span>
            </div>
            <div class="stat-row">
              <span class="stat-label">Configs possibles :</span>
              <span class="stat-value" data-stat-count-agent>-</span>
            </div>
          </div>
          <div class="analysis-error" data-analysis-error-agent hidden></div>
        </div>
      </section>
      <!-- FIN ANALYSE FLAMAPY -->
    </template>

    <template id="moduleTemplate">
      <details class="agent-card" open>
        <summary>
          <div>
            Module : <span class="agent-title">(nouveau module)</span>
          </div>
          <div class="summary-actions">
            <span class="missing-badge" data-missing-badge hidden>Champ obligatoire manquant</span>
            <button type="button" class="secondary accent" data-duplicate-module>Dupliquer</button>
            <button type="button" class="remove-agent secondary danger">Supprimer</button>
          </div>
        </summary>
        <div class="agent-tabs">
          <div class="segmented tabs" role="tablist" aria-label="Vue module">
            <label class="segmented-item" role="tab" aria-selected="true">
              <input type="radio" name="moduleTab" value="features" checked data-default-tab="features" />
              Features
            </label>
            <label class="segmented-item" role="tab" aria-selected="false">
              <input type="radio" name="moduleTab" value="yaml" data-default-tab="yaml" />
              Résumé YAML
            </label>
          </div>
        </div>
        <div class="agent-body">
          <section class="agent-tab-panel" data-tab-panel="features">
            <div class="agent-column">
              <h3>Features</h3>
              <div class="tree" data-agent-tree aria-label="Arbre des features"></div>
            </div>
          </section>
          <section class="agent-tab-panel" data-tab-panel="yaml">
            <div class="agent-column agent-column--summary">
              <div class="summary-block">
                <h3>Résumé YAML</h3>
                <p class="hint">Coller un YAML ici met à jour instantanément le module.</p>
                <div class="yaml-editor">
                  <pre class="code-sample yaml-highlight" data-agent-yaml-preview># Aperçu YAML</pre>
                  <textarea class="yaml-output yaml-input" rows="18" data-agent-yaml placeholder="Le YAML résumé apparaîtra ici..." spellcheck="false"></textarea>
                </div>
                <div class="yaml-actions">
                  <button type="button" class="secondary" data-agent-copy-yaml>Copier</button>
                  <button type="button" class="secondary" data-agent-download-yaml>Télécharger</button>
                  <button type="button" data-agent-load-yaml>Charger le YAML</button>
                </div>
              </div>
            </div>
          </section>
        </div>
      </details>
      <!-- START ANALYSE FLAMAPY-->
      <section class="flamapy analysis">
         <div class="analysis-panel">
          <div class="analysis-controls">
            <button type="button" class="secondary" data-analyze-module-btn>
              Analyser la configuration
            </button>
          </div>
          <div class="analysis-results" data-analysis-results-module hidden>
            <div class="stat-row">
              <span class="stat-label">Validité :</span>
              <span class="stat-value" data-stat-valid-module>-</span>
            </div>
            <div class="stat-row">
              <span class="stat-label">Configs possibles :</span>
              <span class="stat-value" data-stat-count-module>-</span>
            </div>
          </div>
          <div class="analysis-error" data-analysis-error-module hidden></div>
        </div>
      </section>
      <!-- FIN ANALYSE FLAMAPY -->
    </template>

    <template id="orchestrationTemplate">
      <details class="agent-card" open>
        <summary class="summary-hidden"></summary>
        <div class="agent-tabs">
          <div class="segmented tabs" role="tablist" aria-label="Vue workflow">
            <label class="segmented-item" role="tab" aria-selected="true">
              <input type="radio" name="orchestrationTab" value="features" checked data-default-tab="features" />
              Features
            </label>
            <label class="segmented-item" role="tab" aria-selected="false">
              <input type="radio" name="orchestrationTab" value="yaml" data-default-tab="yaml" />
              Résumé YAML
            </label>
          </div>
        </div>
        <div class="agent-body">
          <section class="agent-tab-panel" data-tab-panel="features">
            <div class="agent-column">
              <h3>Features</h3>
              <div class="tree" data-agent-tree aria-label="Arbre des features"></div>
              <div class="orchestration-builder" data-orchestration-builder>
                <div class="builder-grid builder-grid--simple">
                  <div class="builder-block">
                    <h5>Agents</h5>
                    <div class="agent-select-list" data-orch-agents></div>
                  </div>
                  <div class="builder-block">
                    <h5>Modules</h5>
                    <div class="agent-select-list" data-orch-modules></div>
                  </div>
                </div>
                <div class="sequence-panel" data-sequence></div>
                <div class="builder-block">
                  <div class="builder-actions builder-actions--inside">
                    <label class="memory-toggle">
                      <input type="checkbox" data-orch-memory />
                      Mémoire
                    </label>
                    <div class="builder-actions-bottom">
                      <button type="button" class="secondary danger" data-clear-last>Effacer le dernier</button>
                      <button type="button" class="secondary danger" data-clear-all>Tout effacer</button>
                    </div>
                  </div>
                  <div class="graph-panel">
                    <svg data-orch-graph viewBox="0 0 600 160" preserveAspectRatio="xMidYMid meet"></svg>
                  </div>
                </div>
              </div>
            </div>
          </section>
          <section class="agent-tab-panel" data-tab-panel="yaml">
            <div class="agent-column agent-column--summary">
              <div class="summary-block">
                <h3>Résumé YAML</h3>
                <p class="hint">Coller un YAML ici met à jour instantanément le workflow.</p>
                <div class="yaml-editor">
                  <pre class="code-sample yaml-highlight" data-agent-yaml-preview># Aperçu YAML</pre>
                  <textarea class="yaml-output yaml-input" rows="18" data-agent-yaml placeholder="Le YAML résumé apparaîtra ici..." spellcheck="false"></textarea>
                </div>
                <div class="yaml-actions">
                  <button type="button" class="secondary" data-agent-copy-yaml>Copier</button>
                  <button type="button" class="secondary" data-agent-download-yaml>Télécharger</button>
                  <button type="button" data-agent-load-yaml>Charger le YAML</button>
                </div>
              </div>
            </div>
          </section>
        </div>
      </details>
      <!-- START ANALYSE FLAMAPY-->
      <section class="flamapy analysis">
         <div class="analysis-panel">
          <div class="analysis-controls">
            <button type="button" class="secondary" data-analyze-multi-agent-btn>
              Analyser la configuration
            </button>
          </div>

          <div class="analysis-results" data-analysis-results-multiagent hidden>
            <div class="stat-row">
              <span class="stat-label">Validité :</span>
              <span class="stat-value" data-stat-valid-multiagent>-</span>
            </div>
            <div class="stat-row">
              <span class="stat-label">Configs possibles :</span>
              <span class="stat-value" data-stat-count-multiagent>-</span>
            </div>
          </div>
          <div class="analysis-error" data-analysis-error-multiagent hidden></div>
        </div>
      </section>
      <!-- FIN ANALYSE FLAMAPY -->
    </template>
  </body>
</html>
