agent_characteristics:
  core_identity:
    role:
      type: string
      required: true
    goal:
      type: string
      required: true
    backstory:
      type: string
      required: true

  llm_configuration:
    llm:
      type: object
      default: GPT-4 or OPENAI_MODEL_NAME
      configuration_methods:
        alternatives:
          - env_var_model
          - yaml_llm
          - python_llm_object
      providers:
        openai:
          models:
            alternatives: [gpt-4o, gpt-4o-mini, gpt-4-turbo, o1, o3-mini]
          features:
            collection: [function_calling, structured_outputs, streaming, token_tracking]
          context_window:
            gpt-4o: 128K
            gpt-4o-mini: 200K
        anthropic:
          models:
            alternatives: [claude-3-5-sonnet, claude-opus, claude-3-haiku]
          features:
            collection: [extended_thinking, tool_use, streaming]
        google_gemini:
          models:
            alternatives: [gemini-2.5-flash, gemini-2.0-flash, gemini-1.5-pro]
          features:
            collection: [function_calling, multimodal, safety_settings]
          context_window:
            gemini-1.5-pro: 2M
        aws_bedrock:
          models:
            alternatives: [Claude 3.5, Claude 3, Llama 3.1, Amazon Nova, Mistral, Cohere]
          features:
            collection: [converse_api, guardrails, multi_model_access]
          context_window:
            amazon_nova_pro: 300K
        azure:
          endpoints:
            alternatives: [Azure OpenAI, Azure AI Inference endpoints]
          features:
            collection: [function_calling, streaming, endpoint_validation]
        other_providers:
          collection:
            - Meta Llama (Llama-4-Scout, Llama-3.3)
            - Mistral
            - Groq
            - Ollama
            - IBM watsonx.ai
            - Nvidia NIM
            - SambaNova
            - Cerebras
            - Open Router
            - Nebius AI Studio
      parameters:
        temperature:
          type: float
          range: 0.0-1.0
        max_tokens:
          type: integer
        top_p:
          type: float
          default: 0.9
        frequency_penalty:
          type: float
          range: 0.0-2.0
        presence_penalty:
          type: float
          range: 0.0-2.0
        seed:
          type: integer
        stop:
          type: string_or_array
        timeout:
          type: integer
        max_retries:
          type: integer
        reasoning_effort:
          type: string
          alternatives: [low, medium, high]
    function_calling_llm:
      type: object
    multimodal_capabilities:
      providers:
        collection: [Google Gemini, AWS Bedrock, Azure, Nvidia NIM]
      input_types:
        collection: [text, images, video]
    structured_outputs:
      response_format:
        alternatives: [pydantic_base_model]
      supported_by:
        collection: [OpenAI, providers_with_structured_outputs]
    streaming:
      parameters:
        options: [stream]
      events:
        collection: [LLMStreamChunkEvent]
    async_support:
      methods:
        options: [acall]
    transport_interceptors:
      providers:
        collection: [OpenAI, Anthropic]
      use_cases:
        collection: [message_transformation, debugging]

  execution_parameters:
    max_iter:
      type: integer
      default: 20
    max_rpm:
      type: integer
    max_execution_time:
      type: integer
    max_retry_limit:
      type: integer
      default: 2
    respect_context_window:
      type: boolean
      default: true

  tools:
    sources:
      collection: [CrewAI Toolkit, LangChain, Custom tools]
    categories:
      file_and_document:
        collection: [DirectoryReadTool, FileReadTool, PDFSearchTool, DOCXSearchTool]
      web_scraping:
        collection: [ScrapeWebsiteTool, BrowserbaseLoadTool, FirecrawlTools]
      search_and_research:
        collection: [SerperDevTool, EXASearchTool, GithubSearchTool, YoutubeSearchTool]
      database_and_data:
        collection: [PGSearchTool, MySQLTool, RagTool]
      ai_and_ml:
        collection: [DALL-E Tool, Vision Tool, CodeInterpreterTool, LlamaIndexTool]
      cloud_and_storage:
        collection: [S3ReadTool, BedrockKBRetriever]
      automation:
        collection: [ApifyActorsTool, ComposioTool]
    tool_creation_methods:
      subclassing:
        required_attributes:
          collection: [name, description, args_schema]
        required_methods:
          collection: [_run]
      decorator:
        syntax:
          options: ["@tool('Name of my tool')"]
    async_tool_support:
      methods:
        options: ["@tool('fetch_data_async')", async_methods_in_custom_classes]
    tool_caching:
      parameters:
        options: [cache_function]

  behavioral_controls:
    allow_delegation:
      type: boolean
      default: false
    allow_code_execution:
      type: boolean
      alternatives: [safe, unsafe]
    verbose:
      type: boolean
      default: false
    cache:
      type: boolean

  memory:
    enabled_at_crew_level: true
    types:
      collection: [short_term_memory, long_term_memory, entity_memory, contextual_memory]
    storage:
      default_locations:
        macos: ~/Library/Application Support/CrewAI/{project_name}/
        linux: ~/.local/share/CrewAI/{project_name}/
        windows: C:\Users\{username}\AppData\Local\CrewAI\{project_name}\
      contents:
        collection:
          - knowledge/
          - short_term_memory/
          - long_term_memory/
          - entities/
          - long_term_memory_storage.db
      customization:
        environment_variable: CREWAI_STORAGE_DIR
        custom_storage: LongTermMemory with LTMSQLiteStorage
    embedding_providers:
      default: OpenAI
      supported:
        collection: [OpenAI, Ollama, Azure OpenAI, Google AI, Vertex AI, Cohere, VoyageAI, AWS Bedrock, Hugging Face, IBM Watson, Mem0]
      configuration:
        options: [crew_level_embedder, agent_level_embedder]
    external_memory:
      mem0_integration:
        features:
          collection: [user_specific_memory, org_project_scoping, custom_categories, run_tracking]
    events:
      query_events:
        collection: [MemoryQueryStartedEvent, MemoryQueryCompletedEvent, MemoryQueryFailedEvent]
      save_events:
        collection: [MemorySaveStartedEvent, MemorySaveCompletedEvent, MemorySaveFailedEvent]
      retrieval_events:
        collection: [MemoryRetrievalStartedEvent, MemoryRetrievalCompletedEvent]
      properties:
        collection: [query, results, timing_ms, error_info, agent_role]
    management:
      reset_commands:
        collection:
          - crew.reset_memories(command_type='short')
          - crew.reset_memories(command_type='long')
          - crew.reset_memories(command_type='entity')
          - crew.reset_memories(command_type='knowledge')

  reasoning:
    parameter: reasoning
    configuration:
      reasoning:
        type: boolean
        default: false
      max_reasoning_attempts:
        type: integer
    output_elements:
      collection: [task_comprehension, execution_steps, challenge_anticipation, tool_utilization, expected_deliverables, readiness_confirmation]

  knowledge_sources:
    parameter: knowledge_sources
    integration_level:
      alternatives: [agent_level, crew_level]
    supported_formats:
      text_based:
        collection: [StringKnowledgeSource, .txt, PDF, CrewDoclingSource]
      structured_data:
        collection: [CSV, .xlsx, JSON]
    storage:
      technology: ChromaDB
      collections:
        collection: [agent_knowledge, crew_knowledge]
    retrieval_configuration:
      results_limit: 3
      score_threshold: 0.35
    features:
      collection: [query_rewriting, automatic_access, custom_sources]
    events:
      collection:
        - KnowledgeRetrievalStartedEvent
        - KnowledgeRetrievalCompletedEvent
        - KnowledgeQueryStartedEvent
        - KnowledgeQueryCompletedEvent
        - KnowledgeQueryFailedEvent

  template_customization:
    templates:
      collection: [system_template, prompt_template, response_template]

  advanced_features:
    inject_date:
      type: boolean
    expertise_levels:
      alternatives: [novice, intermediate, expert, world_class]
    configuration_formats:
      yaml:
        file: agents.yaml
        features:
          collection: [variable_interpolation]
      python_code: {}
    manager_capabilities:
      responsibilities:
        collection: [planning, delegation, output_validation, task_completion_assessment]

  task_interaction:
    assignment:
      parameter: agent
    context_access:
      parameter: context
    delegation_tools:
      tools:
        collection: [delegate_work_tool, ask_question_tool]
      delegate_work_tool_parameters:
        collection: [task, context, target_coworker]

  performance:
    token_management:
      automatic_context_management: true
      token_counting: true
      task_splitting: true
    rate_limiting:
      parameter: max_rpm
      scope:
        alternatives: [agent_level, crew_level]
    caching:
      tool_caching: true
    cost_tracking:
      monitoring: true

  testing:
    metrics:
      collection: [task_completion_quality, response_accuracy, execution_time, token_usage]

  training:
    data_captured:
      collection: [initial_output, human_feedback, improved_output]
    training_results:
      collection: [suggestions, quality_score, final_summary]
    persistence: trained_agents_data.pkl
    model_recommendations:
      recommended:
        collection: [Mistral 7B, Claude 3 Sonnet, GPT-4o]
      limitations:
        collection: [models_under_7B]

  observability:
    supported_platforms:
      collection: [Arize Phoenix, Braintrust, Datadog, LangFuse, Langchain, Weave, OpenLit]
    capabilities:
      collection: [tracing, performance_monitoring, error_tracking, custom_integrations]
