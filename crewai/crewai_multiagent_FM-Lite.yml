$schema: "https://json-schema.org/draft/2020-12/schema"
title: "CrewAIMultiAgent"
type: object
properties:
  Crew:
    type: object
    properties:
      EssentialComponents:
        type: object
        properties:
          Tasks:
            type: array
            items: { type: object }
          Agents:
            type: array
            items: { type: object }
          Process:
            type: string
            enum: [Sequential, Hierarchical]
        required: [Tasks, Agents]
        additionalProperties: false
      ConfigurationAndControl:
        type: object
        properties:
          Verbose: { type: boolean }
          ManagerLLM: { type: string }
          FunctionCallingLLM: { type: string }
          MaxRPM: { type: integer }
        additionalProperties: false
      MemoryAndPerformance:
        type: object
        properties:
          Memory: { type: boolean }
          EmbedderProviders:
            type: array
            items: { type: string }
          Cache: { type: boolean }
        additionalProperties: false
      OutputLogFileFormat:
        type: string
        enum: [JSON, TXT]
      AdvancedFeatures:
        type: object
        properties:
          ManagerAgent: { type: object }
          PromptFile: { type: string }
          Planning: { type: boolean }
          PlanningLLM: { type: string }
          KnowledgeSources: { type: boolean }
        additionalProperties: false
    required: [EssentialComponents]
    additionalProperties: false
required: [Crew]
additionalProperties: false
allOf:
  - if:
      properties:
        Crew:
          properties:
            EssentialComponents:
              properties:
                Process:
                  const: Hierarchical
              required: [Process]
          required: [EssentialComponents]
      required: [Crew]
    then:
      properties:
        Crew:
          properties:
            ConfigurationAndControl:
              required: [ManagerLLM]
          required: [ConfigurationAndControl]
