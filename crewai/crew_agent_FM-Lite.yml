$schema: "https://json-schema.org/draft/2020-12/schema"
title: "CrewAgent"
type: object
properties:
  Identity:
    type: object
    properties:
      Role: { type: string }
      Goal: { type: string }
      Backstory: { type: string }
    required: [Role, Goal, Backstory]
    additionalProperties: false
  LLMConfiguration:
    type: object
    properties:
      Model: { type: string }
      API_KEY: { type: string }
      Advanced_configs:
        type: object
        properties:
          Temperature: { type: number }
          MaxTokens: { type: integer }
          Top_p: { type: number }
          FrequencyPenalty: { type: number }
          PresencePenalty: { type: number }
          Seed: { type: integer }
          Stop:
            type: array
            items: { type: string }
          Timeout: { type: integer }
          MaxRetries: { type: integer }
        additionalProperties: false
    required: [Model, API_KEY]
    additionalProperties: false
  Task:
    type: object
    properties:
      Essential:
        type: object
        properties:
          Name: { type: string }
          Description: { type: string }
          This_Agent: { type: string }
          ExpectedOutput: { type: string }
        required: [Name, Description, This_Agent]
        additionalProperties: false
      Execution:
        type: object
        properties:
          Task_Tools:
            type: array
            items: { type: string }
          Context:
            type: array
            items: { type: string }
          AsyncExecution: { type: boolean }
          HumanInput: { type: boolean }
          Markdown: { type: boolean }
        additionalProperties: false
      Output:
        type: object
        properties:
          OutputFile: { type: string }
          CreateDirectory: { type: boolean }
          OutputJson: { type: string }
          OutputPydantic: { type: string }
          Task_Callback: { type: string }
          Config: { type: object }
        additionalProperties: false
      ValidationAndSafety:
        type: object
        properties:
          Guardrail: { type: string }
          Guardrails:
            type: array
            items: { type: string }
          GuardrailMaxRetries: { type: integer }
          GuardrailTypes:
            type: string
            enum: [FunctionBased, LLMBased]
        additionalProperties: false
    required: [Essential]
    additionalProperties: false
  Agent_Tools:
    type: array
    items: { type: string }
  BehavioralControls:
    type: object
    properties:
      AllowDelegation: { type: boolean }
      AllowCodeExecution: { type: boolean }
      Verbose: { type: boolean }
      Cache: { type: boolean }
    additionalProperties: false
  Memory: { type: boolean }
  Reasoning: { type: boolean }
  # KnowledgeSources: { type: boolean }
required: [Identity, LLMConfiguration, Task]
additionalProperties: false
