$schema: "https://json-schema.org/draft/2020-12/schema"
title: "GearMultiAgent"
type: object
properties:
  Agents:
    type: array
    items: { type: object }
  Orchestration:
    type: object
    properties:
      Nodes:
        type: array
        items:
          oneOf:
            - type: object
              properties:
                AgentNode:
                  type: object
                  properties:
                    AgentRef: { type: string }
                  required: [AgentRef]
                  additionalProperties: false
              required: [AgentNode]
              additionalProperties: false
            - type: object
              properties:
                OrchestrationNode:
                  type: object
                  properties:
                    Strategy:
                      type: object
                      oneOf:
                        - required: [Sequential]
                          properties:
                            Sequential:
                              type: object
                              additionalProperties: false
                          additionalProperties: false
                        - required: [Loop]
                          properties:
                            Loop:
                              type: object
                              properties:
                                TurnCount: { type: integer }
                              required: [TurnCount]
                              additionalProperties: false
                          additionalProperties: false
                        - required: [Parallel]
                          properties:
                            Parallel:
                              type: object
                              properties:
                                Aggregator: { type: string }
                              required: [Aggregator]
                              additionalProperties: false
                          additionalProperties: false
                        - required: [custom]
                          properties:
                            custom:
                              type: object
                              additionalProperties: true
                          additionalProperties: false
                  required: [Strategy]
                  additionalProperties: false
              required: [OrchestrationNode]
              additionalProperties: false
      Edges:
        type: array
        items:
          type: object
          properties:
            FromNode: { type: string }
            ToNode: { type: string }
          required: [FromNode, ToNode]
          additionalProperties: false
    required: [Nodes, Edges]
    additionalProperties: false
  RootNode: { type: string }
  Memory: { type: boolean }
required: [Agents, Orchestration]
additionalProperties: false
