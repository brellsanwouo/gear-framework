GearAgent:
  AgentIdentity:
    Name: ConferenceContextAgent
    Purpose: present the conference situation and its factual information.
    ContextDescription: >-
      The conference runs from 09:00 to 12:00 and both rooms are closed for a break from 10:20 to 10:40. Auditorium has capacity 120, a projector, and video conferencing. SeminarRoom has capacity 50 and a projector but no video conferencing. Presentations are: Reliable AI Systems, Alice Martin, 40 minutes, audience 90, projector, available 09:00-12:00; Efficient Scientific Workflows, Bruno Lee, 40 minutes, audience 45, projector, available 09:00-12:00; Reproducible Experiments, Carla Diaz, 45 minutes, audience 80, video conferencing, available 10:40-12:00; Open Research Data, David Kim, 30 minutes, audience 70, projector, must finish by 10:20; Human-Centred Evaluation, Elena Rossi, 50 minutes, audience 45, projector, available 09:40-12:00; Research Software Careers, Farid Noor, 35 minutes, audience 35, no equipment requirement, available 09:00-12:00. Each presentation occurs once. A room and speaker can each host at most one presentation at a time. Report only these facts. Never formulate a problem, analyze constraints, propose a schedule, or explain another agent.
  LLMConfiguration:
    Provider: openai
    Model: gpt-4o-mini
  TaskSpecification:
    TaskName: ConferenceContextTask
    TaskDescription: >-
      State only the hours, break, rooms, and each presentation's speaker, duration, audience, equipment, and availability.
    ExpectedOutput: A complete factual conference brief with no analysis or schedule.
---
GearAgent:
  AgentIdentity:
    Name: TimeConstraintAnalyzerAgent
    Purpose: identify the valid time constraints.
    ContextDescription: Performs temporal analysis only from the output of ConferenceContextAgent.
  LLMConfiguration:
    Provider: openai
    Model: gpt-4o-mini
  TaskSpecification:
    TaskName: TimeConstraintAnalyzerTask
    TaskDescription: >-
      Analyze only conference hours, presentation durations, the break, speaker availability, and temporal non-overlap. Do not assign rooms or analyze capacity and equipment.
    ExpectedOutput: A presentation-by-presentation list of valid temporal windows plus global temporal rules.
---
GearAgent:
  AgentIdentity:
    Name: RoomConstraintAnalyzerAgent
    Purpose: identify the valid room assignments.
    ContextDescription: Performs room analysis only from the output of ConferenceContextAgent.
  LLMConfiguration:
    Provider: openai
    Model: gpt-4o-mini
  TaskSpecification:
    TaskName: RoomConstraintAnalyzerTask
    TaskDescription: >-
      Analyze only room capacities, equipment, and room non-overlap requirements. Do not choose times or analyze speaker availability.
    ExpectedOutput: For each presentation, eligible rooms and the reason for every exclusion.
---
GearAgent:
  AgentIdentity:
    Name: SchedulePlannerAgent
    Purpose: build a valid conference schedule.
    ContextDescription: Combines the independent temporal and room analyses after their parallel execution.
  LLMConfiguration:
    Provider: openai
    Model: gpt-4o-mini
  TaskSpecification:
    TaskName: SchedulePlannerTask
    TaskDescription: >-
      Combine both analyses and schedule every presentation exactly once while satisfying all temporal and room constraints.
    ExpectedOutput: A Markdown table with Start, End, Room, Presentation, and Speaker columns, sorted by start time and room.
