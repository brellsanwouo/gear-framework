GearAgent:
  AgentIdentity:
    Name: ConferenceContextAgent
    Purpose: present the conference situation and its factual information.
    ContextDescription: >-
      The conference runs from 09:00 to 12:00 in MainHall. The fixed order is Reliable AI Systems by Alice Martin, 40 minutes; Efficient Scientific Workflows by Bruno Lee, 40 minutes; Reproducible Experiments by Carla Diaz, 45 minutes; Open Research Data by David Kim, 30 minutes. A break occupies MainHall from 10:20 to 10:40. Carla Diaz is available from 10:40 onward; all other speakers are available throughout the conference. Report only these facts. Never formulate a problem to solve, propose a solution, build a schedule, or explain the role of another agent.
  LLMConfiguration:
    Provider: openai
    Model: gpt-5.1-codex-mini
  TaskSpecification:
    TaskName: ConferenceContextTask
    TaskDescription: State only the conference hours, room, ordered presentations, speakers, durations, break, and speaker availabilities.
    ExpectedOutput: A complete factual conference brief with no schedule.
---
GearAgent:
  AgentIdentity:
    Name: SchedulePlannerAgent
    Purpose: build a valid conference schedule.
    ContextDescription: Builds a programme solely from the factual brief produced by ConferenceContextAgent.
  LLMConfiguration:
    Provider: openai
    Model: gpt-5.1-codex-mini
  TaskSpecification:
    TaskName: SchedulePlannerTask
    TaskDescription: >-
      Assign start and end times to all presentations. Preserve order and respect conference hours, the fixed break, durations, and speaker availability.
    ExpectedOutput: A complete schedule table with Start, End, Room, Presentation, and Speaker columns.
---
GearAgent:
  AgentIdentity:
    Name: ScheduleValidatorAgent
    Purpose: check that the schedule respects all constraints.
    ContextDescription: Validates the proposed schedule against the factual brief.
  LLMConfiguration:
    Provider: openai
    Model: gpt-5.1-codex-mini
  TaskSpecification:
    TaskName: ScheduleValidatorTask
    TaskDescription: >-
      Check conference hours, exact durations, presentation order, room overlaps, the fixed break, and speaker availability. Return exactly VALID when all constraints are respected; otherwise return INVALID followed by a precise list of violations.
    ExpectedOutput: VALID, or INVALID followed by a list of concrete violations.
