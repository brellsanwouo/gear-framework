  <g font-family="Arial" font-size="14" text-anchor="middle"><rect x="20" y="80" width="220" height="50" rx="8" fill="#e8f0fe" stroke="#3568a8" stroke-width="2"/><text x="130" y="110" fill="#17365d">ConferenceContextAgent</text><rect x="285" y="80" width="220" height="50" rx="8" fill="#e9f7ef" stroke="#287a4b" stroke-width="2"/><text x="395" y="110" fill="#185c37">SchedulePlannerAgent</text><rect x="550" y="80" width="220" height="50" rx="8" fill="#fff4df" stroke="#a76a00" stroke-width="2"/><text x="660" y="110" fill="#744900">ScheduleReviewerAgent</text><rect x="815" y="80" width="220" height="50" rx="8" fill="#fff4df" stroke="#a76a00" stroke-width="2"/><text x="925" y="110" fill="#744900">ScheduleRefinerAgent</text><rect x="1080" y="80" width="180" height="50" rx="8" fill="#e9f7ef" stroke="#287a4b" stroke-width="2"/><text x="1170" y="110" fill="#185c37">FinalScheduleAgent</text></g>
  <g fill="none" stroke="#3568a8" stroke-width="2" marker-end="url(#a)"><line x1="240" y1="105" x2="275" y2="105"/><line x1="505" y1="105" x2="540" y2="105"/><line x1="770" y1="105" x2="805" y2="105"/><line x1="1035" y1="105" x2="1070" y2="105"/><path d="M925 78 C925 25 660 25 660 70"/></g><text x="792" y="20" text-anchor="middle" font-family="Arial" font-size="13" fill="#744900">exactly 2 iterations</text>
