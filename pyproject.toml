[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gear-framework"
dynamic = ["version"]
description = "Gear Framework: design portable multi-agent systems with feature-model based specifications and generate code for multiple execution frameworks."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10,<3.14"
dependencies = [
  "flamapy>=2.0,<3",
  "flamapy-bdd>=2.0,<3",
  "flamapy-fm>=2.0,<3",
  "flamapy-sat>=2.0,<3",
  "flask>=3.0,<4",
  "flask-cors>=6.0,<7",
  "jsonschema>=4.23,<5",
  "Markdown>=3.8,<4",
  "psycopg2-binary>=2.9,<3",
  "python-dotenv>=1.1,<2",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
execution = [
  "crewai>=1.15.4,<2",
  "google-adk>=2.5,<3",
  "langchain>=1.0,<2",
  "langchain-openai>=1.0,<2",
  "langgraph>=1.0,<2",
  "agent-framework-core>=1.11,<2",
  "agent-framework-openai>=1.10,<2",
  "openai-agents>=0.18,<1",
  "strands-agents[openai]>=1.48,<2",
  "pydantic-ai-slim[openai]>=2.13,<3",
  "autogen-agentchat>=0.7.5,<1",
  "autogen-ext[openai]>=0.7.5,<1",
  "semantic-kernel>=1.44,<2",
  "haystack-ai>=2.31,<3",
  "litellm>=1.84,<2",
  "mlflow[genai]>=3.10,<4",
  "opentelemetry-api>=1.42,<1.43",
  "opentelemetry-sdk>=1.42,<1.43",
  "opentelemetry-exporter-otlp-proto-http>=1.42,<1.43",
]
execution-crewai = ["crewai>=1.15.4,<2", "litellm>=1.84,<2", "mlflow[genai]>=3.10,<4"]
execution-adk = ["google-adk>=2.5,<3", "litellm>=1.84,<2", "mlflow[genai]>=3.10,<4", "opentelemetry-exporter-otlp-proto-http>=1.42,<1.43"]
execution-langgraph = ["langchain>=1.0,<2", "langchain-openai>=1.0,<2", "langgraph>=1.0,<2", "mlflow>=3.10,<4"]
execution-openai-agents = ["openai-agents>=0.18,<1", "mlflow>=3.10,<4"]
execution-microsoft-agent-framework = ["agent-framework-core>=1.11,<2", "agent-framework-openai>=1.10,<2", "mlflow>=3.10,<4"]
execution-strands = ["strands-agents[openai]>=1.48,<2", "mlflow>=3.10,<4"]
execution-pydantic-ai = ["pydantic-ai-slim[openai]>=2.13,<3", "mlflow>=3.10,<4"]
execution-autogen = ["autogen-agentchat>=0.7.5,<1", "autogen-ext[openai]>=0.7.5,<1", "mlflow>=3.10,<4"]
execution-semantic-kernel = ["semantic-kernel>=1.44,<2", "mlflow>=3.10,<4"]
execution-haystack = ["haystack-ai>=2.31,<3", "mlflow>=3.10,<4"]
dev = [
  "build>=1.2,<2",
  "pytest>=8,<10",
]

[project.scripts]
gear = "gear_sdk.cli:main"
gear-server = "server:main"

[tool.setuptools]
py-modules = ["server"]

[tool.setuptools.dynamic]
version = {attr = "gear_sdk.version.__version__"}

[tool.setuptools.packages.find]
include = ["gear_sdk*", "gear_web*"]

[tool.setuptools.package-data]
gear_sdk = ["py.typed", "runtime/*.js"]

[tool.setuptools.data-files]
"share/gear-framework" = ["config.yml"]
"share/gear-framework/ui" = [
  "ui/index.html", "ui/app.js", "ui/styles.css", "ui/README.md",
  "ui/manual.html", "ui/manual.js", "ui/manual.css",
  "ui/experiment.html", "ui/experiment.js", "ui/experiment.css",
  "ui/overlay.js", "ui/overlay.css", "ui/feature-policy.yml",
