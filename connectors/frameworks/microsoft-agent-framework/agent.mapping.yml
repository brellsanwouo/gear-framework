- {from: LLMConfiguration.MaxRetries, to: null, kind: not_mapped}
- {from: LLMConfiguration.ModelParameters, to: Agent.default_options, kind: equivalent}
- {from: TaskSpecification.TaskName, to: Agent.metadata.task_name, kind: equivalent}
