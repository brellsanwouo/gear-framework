# Gear -> ADK (workflow)
# Source model: gear-framework/gear/gear-multiagent.uvl (YAML runtime: WorkflowName, Items, Edges, Memory)

- from: WorkflowName
  to: SystemDefinition.RootAgent
  kind: partial
  notes: "ADK root workflow name."

- from: WorkflowName
  to: Runtime.Workflow.RootName
  kind: partial
  notes: "Name applied to root_agent in the Python code."

- from: Items.Agents
  to: SystemDefinition.Agents
  kind: direct

- from: Items.Modules
  to: SystemDefinition.WorkflowModules
  kind: partial

- from: Edges
  to: SystemDefinition.WorkflowEdges
  kind: partial

- from: Memory
  to: Runtime.Memory.WorkflowEnabled
  kind: partial
  notes: "Enable long-term memory at workflow level."

- from:
  to: Runtime.Memory.MemoryServiceClass
  value: InMemoryMemoryService
  kind: partial
  notes: "Memory service class used when memory is enabled."

- from:
  to: Runtime.Memory.AgentToolClass
  value: PreloadMemoryTool
  kind: partial
  notes: "Memory tool added to agents when memory is enabled."

- from:
  to: Infrastructure.Runner.Configuration.AppName
  value: gear-framework
  kind: partial
