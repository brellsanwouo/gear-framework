# Gear -> ADK (agent)
# Source model: gear-framework/gear/gear-agent.yml
# Target model: adk/adk_agent_FM-Lite.yml

- from: AgentIdentity.Name
  to: BaseAgent.Name
  kind: direct

- from: AgentIdentity.Purpose
  to: BaseAgent.Description
  kind: partial
  notes: "Concatenate Purpose and ContextDescription when needed."

- from: AgentIdentity.ContextDescription
  to: BaseAgent.Description
  kind: partial

- from: LLMConfiguration.Model
  to: LLMAgentConfig.Model
  kind: direct

- from: LLMConfiguration.Provider
  to: LLMAgentConfig.Provider
  kind: partial
  notes: "Expose the provider in YAML in addition to the model."

- from: LLMConfiguration.APIKey
  to: null
  kind: not_mapped
  notes: "API key handled outside the ADK schema."

- from: LLMConfiguration.BaseURL
  to: LLMAgentConfig.LiteLlm.api_base
  kind: partial
  notes: "Passed to the LiteLlm adapter for OpenAI-compatible endpoints."

- from: LLMConfiguration.Timeout
  to: LLMAgentConfig.LiteLlm.timeout
  kind: direct

- from: LLMConfiguration.MaxRetries
  to: LLMAgentConfig.LiteLlm.num_retries
  kind: equivalent

- from: LLMConfiguration.ModelParameters.Temperature
  to: LLMAgentConfig.GenerateContentConfig.Temperature
  kind: direct

- from: LLMConfiguration.ModelParameters.MaxTokens
  to: LLMAgentConfig.GenerateContentConfig.MaxOutputTokens
  kind: equivalent

- from: LLMConfiguration.ModelParameters.TopP
  to: LLMAgentConfig.GenerateContentConfig.TopP
  kind: direct

- from: LLMConfiguration.ModelParameters.TopK
  to: LLMAgentConfig.GenerateContentConfig.TopK
  kind: direct

- from: LLMConfiguration.ModelParameters.StopSequences
  to: LLMAgentConfig.GenerateContentConfig.StopSequences
  kind: direct

- from: LLMConfiguration.ModelParameters.AdditionalParams
  to: LLMAgentConfig.LiteLlm.additional_args
  kind: partial

- from: LLMConfiguration.ModelParameters.FrequencyPenalty
  to: LLMAgentConfig.GenerateContentConfig.FrequencyPenalty
  kind: direct

- from: LLMConfiguration.ModelParameters.PresencePenalty
  to: LLMAgentConfig.GenerateContentConfig.PresencePenalty
  kind: direct

- from: LLMConfiguration.ModelParameters.Seed
  to: LLMAgentConfig.GenerateContentConfig.Seed
  kind: direct

- from: TaskSpecification.TaskDescription
  to: Configurations.Instruction
  kind: direct

- from: TaskSpecification.TaskName
  to: Configurations.DataStructure.OutputKey
  kind: partial

- from: TaskSpecification.ExpectedOutput
  to: Configurations.DataStructure.OutputSchema
  kind: partial

- from: TaskSpecification.AssignedAgent
  to: null
  kind: not_mapped
  notes: "ADK Lite does not provide field-level assignment."

- from: Tools
  to: Configurations.Tools
  kind: partial

- from: ExecutionControl.DelegationControl
  to: BaseAgent.SubAgents
  kind: partial
  notes: "SubAgents is a list, not a boolean."

- from: ExecutionControl.CodeExecutionControl
  to: Configurations.CodeExecutor
  kind: equivalent

- from: ExecutionControl.AsyncExecutionControl
  to: null
  kind: not_mapped
  notes: "No direct equivalent exists in ADK Lite."

- from: ExecutionControl.HumanInteractionControl
  to: Guardrails.AgentLifecycle.BeforeAgentCallback
  kind: partial
  notes: "Adapt through callbacks."

- from: ExecutionControl.VerbosityControl
  to: Guardrails.AgentLifecycle.AfterAgentCallback
  kind: partial
  notes: "Adapt through callbacks and logging."

- from: ExecutionControl.CachingControl
  to: Guardrails.ModelInteraction.BeforeModelCallback
  kind: partial
  notes: "Adapt through middleware or the runtime."

- from: Memory
  to: Runtime.Memory.AgentEnabled
  kind: partial
  notes: "Enable agent memory (memory tool) in the generated ADK code."

- from: Reasoning
  to: Configurations.Planner.BuiltInPlanner.ThinkingConfig.IncludeThoughts
  kind: partial
