# Gear -> CrewAI (agent)
# Source model: gear-framework/gear/gear-agent.yml
# Target model: crewai/crew_agent_FM-Lite.yml

- from: AgentIdentity.Name
  to: Identity.Role
  kind: equivalent
  notes: CrewAI uses Role as its primary identifier.

- from: AgentIdentity.Purpose
  to: Identity.Goal
  kind: equivalent
  notes: Agent objective.

- from: AgentIdentity.ContextDescription
  to: Identity.Backstory
  kind: equivalent
  notes: Agent context and persona.

- from: LLMConfiguration.Provider
  to: LLM.provider
  kind: partial
  notes: "Expose the provider in YAML in addition to the model."

- from: LLMConfiguration.Model
  to: LLMConfiguration.Model
  kind: direct

- from: LLMConfiguration.APIKey
  to: null
  kind: not_mapped
  notes: Read from the provider environment variable.

- from: LLMConfiguration.BaseURL
  to: LLMConfiguration.BaseURL
  kind: direct

- from: LLMConfiguration.Timeout
  to: LLMConfiguration.Advanced_configs.Timeout
  kind: direct

- from: LLMConfiguration.MaxRetries
  to: Agent.max_retry_limit
  kind: partial

- from: LLMConfiguration.ModelParameters.Temperature
  to: LLMConfiguration.Advanced_configs.Temperature
  kind: direct

- from: LLMConfiguration.ModelParameters.MaxTokens
  to: LLMConfiguration.Advanced_configs.MaxTokens
  kind: direct

- from: LLMConfiguration.ModelParameters.TopP
  to: LLMConfiguration.Advanced_configs.Top_p
  kind: equivalent

- from: LLMConfiguration.ModelParameters.StopSequences
  to: LLMConfiguration.Advanced_configs.Stop
  kind: equivalent

- from: LLMConfiguration.ModelParameters.FrequencyPenalty
  to: LLMConfiguration.Advanced_configs.FrequencyPenalty
  kind: direct

- from: LLMConfiguration.ModelParameters.PresencePenalty
  to: LLMConfiguration.Advanced_configs.PresencePenalty
  kind: direct

- from: LLMConfiguration.ModelParameters.Seed
  to: LLMConfiguration.Advanced_configs.Seed
  kind: direct

- from: LLMConfiguration.ModelParameters.AdditionalParams
  to: LLMConfiguration.Advanced_configs.AdditionalParams
  kind: partial

- from: TaskSpecification.TaskName
  to: Task.Essential.Name
  kind: partial

- from: TaskSpecification.TaskDescription
  to: Task.Essential.Description
  kind: direct

- from: TaskSpecification.ExpectedOutput
  to: Task.Essential.ExpectedOutput
  kind: direct

- from: TaskSpecification.AssignedAgent
  to: Task.Essential.This_Agent
  kind: partial

- from: Tools
  to: null
  kind: not_mapped
  notes: Tool names alone cannot define executable CrewAI BaseTool implementations.

- from: ExecutionControl.DelegationControl
  to: BehavioralControls.AllowDelegation
  kind: partial

- from: ExecutionControl.CodeExecutionControl
  to: BehavioralControls.AllowCodeExecution
  kind: partial

- from: ExecutionControl.AsyncExecutionControl
  to: Crew.kickoff_async
  kind: equivalent

- from: ExecutionControl.HumanInteractionControl
  to: Task.Execution.HumanInput
  kind: partial

- from: ExecutionControl.VerbosityControl
  to: BehavioralControls.Verbose
  kind: partial

- from: ExecutionControl.CachingControl
  to: BehavioralControls.Cache
  kind: partial

- from: Reasoning
  to: Reasoning
  kind: partial

- from: Memory
  to: Memory
  kind: partial
