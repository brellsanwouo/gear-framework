# Gear -> CrewAI (workflow)
# Source model: gear-framework/gear/gear-multiagent.uvl (YAML runtime: WorkflowName, Items, Edges, Memory)

- from: WorkflowName
  to: Crew.Metadata.Name
  kind: partial
  notes: "Logical workflow name."

- from: Items.Agents
  to: Crew.EssentialComponents.Agents
  kind: direct
  notes: "List of agents used in the workflow."

- from: Items.Modules
  to: Crew.EssentialComponents.Modules
  kind: partial
  notes: "Module information, useful for extensions."

- from: Edges
  to: Crew.Orchestration.Edges
  kind: partial
  notes: "Workflow ordering graph."

- from: Memory
  to: Crew.MemoryAndPerformance.Memory
  kind: partial

- from:
  to: Crew.EssentialComponents.Process
  value: sequential
  kind: partial
  notes: "CrewAI uses Process.sequential by default."
