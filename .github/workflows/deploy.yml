name: Deploy GEAR to Inria VM

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: gear-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          INRIA_SSH_PRIVATE_KEY: ${{ secrets.INRIA_SSH_PRIVATE_KEY }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          JUMP_HOST: ${{ secrets.JUMP_HOST }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          echo "$INRIA_SSH_PRIVATE_KEY" > ~/.ssh/inria_deploy_key
          chmod 600 ~/.ssh/inria_deploy_key

          ssh-keyscan -H "$JUMP_HOST" >> ~/.ssh/known_hosts

          cat > ~/.ssh/config <<EOF
          Host inria-jump
            HostName ${JUMP_HOST}
            User ${DEPLOY_USER}
            IdentityFile ~/.ssh/inria_deploy_key
            StrictHostKeyChecking accept-new

          Host gear-public
            HostName ${DEPLOY_HOST}
            User ${DEPLOY_USER}
            IdentityFile ~/.ssh/inria_deploy_key
            ProxyJump inria-jump
            StrictHostKeyChecking accept-new
          EOF

          chmod 600 ~/.ssh/config

      - name: Test SSH connection
        run: |
          ssh gear-public "hostname && whoami"

      - name: Prepare remote temporary directory
        run: |
          ssh gear-public "rm -rf /tmp/gear-framework-deploy && mkdir -p /tmp/gear-framework-deploy"

      - name: Upload application files
        run: |
          rsync -az --delete \
            --exclude ".git/" \
            --exclude ".github/" \
            --exclude "__pycache__/" \
            --exclude "*.pyc" \
            --exclude ".env" \
            --exclude "venv/" \
            --exclude ".venv/" \
            ./ gear-public:/tmp/gear-framework-deploy/

      - name: Deploy and restart service
        run: |
          ssh gear-public <<'EOF'
          set -euo pipefail

          echo "Checking Python syntax..."
          /opt/gear/venv/bin/python -m py_compile /tmp/gear-framework-deploy/server.py

          echo "Copying files to /opt/gear/gear-framework..."
          sudo rsync -az --delete \
            --exclude "venv/" \
            --exclude ".venv/" \
            --exclude "__pycache__/" \
            --exclude "*.pyc" \
            /tmp/gear-framework-deploy/ /opt/gear/gear-framework/

          echo "Fixing ownership..."
          sudo chown -R nzine:gear /opt/gear/gear-framework || true

          echo "Checking the Node.js conversion runtime..."
          if ! command -v node > /dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y nodejs
          fi
          node --version

          echo "Installing dependencies..."
          cd /opt/gear/gear-framework
          if [ -f requirements.txt ]; then
            sudo /opt/gear/venv/bin/python -m pip install -r requirements.txt
          fi

          sudo /opt/gear/venv/bin/python -m pip install psycopg2-binary

          echo "Configuring MLflow observability..."
          sudo touch /etc/gear.env
          sudo sed -i '/^MLFLOW_TRACKING_URI=/d' /etc/gear.env
          echo 'MLFLOW_TRACKING_URI=http://gear-backend.lille.inria.fr:5000' | sudo tee -a /etc/gear.env > /dev/null
          sudo sed -i '/^GEAR_MLFLOW_ENABLED=/d' /etc/gear.env
          echo 'GEAR_MLFLOW_ENABLED=true' | sudo tee -a /etc/gear.env > /dev/null
          sudo sed -i '/^GEAR_TRACKING_ENABLED=/d' /etc/gear.env
          echo 'GEAR_TRACKING_ENABLED=true' | sudo tee -a /etc/gear.env > /dev/null
          sudo sed -i '/^GEAR_ENABLE_LOCAL_RUNNER=/d' /etc/gear.env
          echo 'GEAR_ENABLE_LOCAL_RUNNER=true' | sudo tee -a /etc/gear.env > /dev/null
          if ! sudo grep -Eq '^DATABASE_URL=.+$' /etc/gear.env; then
            echo 'DATABASE_URL is missing from /etc/gear.env; research tracking cannot be enabled.' >&2
            exit 1
          fi
          if ! sudo grep -Eq '^MLFLOW_EXPERIMENT_NAME=.+$' /etc/gear.env; then
            echo 'MLFLOW_EXPERIMENT_NAME=gear-framework-production' | sudo tee -a /etc/gear.env > /dev/null
          fi
          if ! sudo grep -Eq '^MLFLOW_HTTP_REQUEST_TIMEOUT=.+$' /etc/gear.env; then
            echo 'MLFLOW_HTTP_REQUEST_TIMEOUT=5' | sudo tee -a /etc/gear.env > /dev/null
          fi
          if ! sudo grep -Eq '^MLFLOW_HTTP_REQUEST_MAX_RETRIES=.+$' /etc/gear.env; then
            echo 'MLFLOW_HTTP_REQUEST_MAX_RETRIES=1' | sudo tee -a /etc/gear.env > /dev/null
          fi

          mlflow_uri="$(sudo sed -n 's/^MLFLOW_TRACKING_URI=//p' /etc/gear.env | tail -n 1)"
          echo "Checking MLflow tracking server..."
          curl -fsS "${mlflow_uri%/}/health" > /dev/null

          echo "Restarting gear-app..."
          sudo systemctl daemon-reload
          sudo systemctl restart gear-app

          echo "Checking service..."
          sleep 3
          sudo systemctl is-active --quiet gear-app

          echo "Testing local gear-app..."
          curl -fsS http://127.0.0.1:8200 > /dev/null
          /opt/gear/venv/bin/python - <<'PY'
          import json
          import urllib.request

          with urllib.request.urlopen("http://127.0.0.1:8200/api/run/status") as response:
              payload = json.load(response)
          assert payload["observability"]["enabled"], payload
          assert payload["enabled"], payload
          print("MLflow observability enabled.")

          build_payload = {
              "project_id": "deployment-smoke",
              "project_name": "Deployment smoke",
              "target": "crewai",
              "agents": [{
                  "AgentIdentity": {"Name": "Smoke", "Purpose": "Verify deployment", "ContextDescription": "CI"},
                  "LLMConfiguration": {"Provider": "openai", "Model": "gpt-4o-mini"},
                  "TaskSpecification": {"TaskName": "Smoke", "TaskDescription": "Verify", "ExpectedOutput": "Ready"},
              }],
              "modules": [],
              "workflow": {
                  "WorkflowName": "Main",
                  "Items": {"Agents": ["Smoke"], "Modules": []},
                  "Edges": [],
              },
              "workflow_sequence": [{"kind": "agent", "name": "Smoke"}],
          }
          build_request = urllib.request.Request(
              "http://127.0.0.1:8200/api/studio/builds",
              data=json.dumps(build_payload).encode(),
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          with urllib.request.urlopen(build_request) as response:
              build = json.load(response)
          code = build["outputs"]["orchestration"]
          assert "GEAR MLflow observability" in code, build
          print("Online code generation enabled and MLflow-instrumented.")

          with urllib.request.urlopen("http://127.0.0.1:8200/api/experiment/status") as response:
              research = json.load(response)
          assert research["tracking_enabled"], research
          assert research["database_available"], research
          print("Research database enabled.")
          PY

          echo "Deployment successful."
          EOF
