name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run Python tests
        continue-on-error: true
        run: python -m pytest -q

      - name: Run JavaScript tests
        continue-on-error: true
        run: node --test tests/*.test.js

      - name: Check app.js syntax
        run: node --check ui/app.js

      - name: Check studio.js syntax
        run: node --check ui/studio.js

      - name: Check resource-loader.js syntax
        run: node --check ui/js/resource-loader.js

      - name: Check project-storage.js syntax
        run: node --check ui/js/project-storage.js

      - name: Check conversion-core.js syntax
        run: node --check gear_sdk/runtime/conversion-core.js

      - name: Check assembly-engine.js syntax
        run: node --check gear_sdk/runtime/assembly-engine.js

      - name: Build Python package
        run: python -m build

  secrets:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2