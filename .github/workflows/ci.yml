name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: node --test tests/*.test.js
      - run: node --check ui/app.js
      - run: node --check ui/studio.js
      - run: node --check ui/js/resource-loader.js
      - run: node --check ui/js/project-storage.js
      - run: node --check gear_sdk/runtime/conversion-core.js
      - run: node --check gear_sdk/runtime/assembly-engine.js
      - run: python -m build

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
