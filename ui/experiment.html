<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gear Experiment Lobby</title>
    <link rel="stylesheet" href="experiment.css">
    <script src="experiment.js" defer></script>
</head>
<body>

    <div id="introScreen" class="card">
        <h1>Gear Experiment</h1>
        <p>Welcome. You will complete tasks in both Gear and manual modes.</p>
        <label class="consent-row">
            <input id="consentCheckbox" type="checkbox">
            I have read the study information and consent to participate.
        </label>
        <button id="startBtn" disabled>Start the experiment</button>
    </div>

    <div id="pauseScreen" class="card hidden">
      <h1>Task completed</h1>

      <p id="pauseText">
        <span id="progressText"></span><br>
        Take a break if needed.<br>
        Click below to start the next task <span id="nextTaskName">...</span>.
      </p>

      <button id="nextBtn">Start</button>
    </div>

    <div id="endScreen" class="card hidden">
        <h1>Thank you!</h1>
        <p id="endMessage">The experiment is finished.</p>
    </div>

</body>
</html>
