<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gear Experiment Lobby</title>
    <link rel="stylesheet" href="experiment.css">
    <script src="experiment.js" defer></script>
</head>
<body>

    <div id="introScreen" class="card">
        <h1>Gear Experiment</h1>
        <p>Welcome</p>
        <button id="startBtn">Start the experiment</button>
    </div>

    <div id="pauseScreen" class="card hidden">
      <h1>Task completed</h1>

      <p id="pauseText">
        Take a break if needed.<br>
        Click below to start the next task <span id="nextTaskName">...</span>.
      </p>

      <button id="nextBtn">Start</button>
    </div>

    <div id="endScreen" class="card hidden">
        <h1>Thank you!</h1>
        <p>The experiment is finished. Your results have been saved.</p>
    </div>

</body>
</html>
