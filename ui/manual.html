<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manual Mode - Code Editor</title>
    <link rel="stylesheet" href="manual.css">

    <link rel="stylesheet" href="overlay.css">
    <script src="overlay.js" defer></script>

    <script src="manual.js" defer></script>
</head>
<body>

    <main class="main-card">

        <div class="editor-column">
            <h3 class="section-title">Script Editor</h3>
            <div class="editor-container">
                <textarea
                    id="manualInput"
                    placeholder="# Select your framework on the right, then paste your code here...
# CrewAI example:
from crewai import Agent, Task, Crew
...

# Google ADK example:
from google.adk.agents import Agent
..."
                    spellcheck="false"></textarea>
            </div>
        </div>

        <aside class="run-panel">
            <h3 class="section-title">Configuration</h3>

            <div class="control-group">
                <label for="frameworkTarget">Target Framework:</label>
                <select id="frameworkTarget" class="framework-select">
                    <option value="crewai">CrewAI</option>
                    <option value="adk">Google ADK</option>
                </select>
            </div>

            <div class="run-actions">
                <button type="button" id="runWorkflowBtn" class="secondary action-btn">▶ Run workflow</button>
                <button type="button" id="stopWorkflowBtn" class="secondary danger action-btn">■ Stop</button>
            </div>

            <div class="output-wrapper">
                <label>Console output:</label>
                <pre id="runOutput" class="code-sample run-output"># Waiting for execution...</pre>
            </div>
        </aside>

    </main>

</body>
</html>
